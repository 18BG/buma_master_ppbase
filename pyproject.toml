[project]
name = "buma-master-ppbase"
version = "0.1.0"
description = "BUMA Master backend reimplemented with PPBase, Python and PostgreSQL."
requires-python = ">=3.11"
dependencies = [
    "ppbase>=0.3.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.5.0",
    "mypy>=1.8",
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*", "scripts*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
ignore_missing_imports = true
